<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;700&display=swap');
:root{
  --void:#0A0A0B; --slab:#141417; --slab2:#0F0F11;
  --line:rgba(242,240,235,.10); --line2:rgba(242,240,235,.055);
  --bone:#F2F0EB; --mute:#8C8C92; --mute2:#5A5A61;
  --steel:#B6B6BD; --signal:#3D5AFE; --hot:#FF4D2E; --ok:#4ADE80; --bad:#FF4D2E;
  --ink:var(--void); --panel:var(--slab); --panel2:var(--slab2); --txt:var(--bone);
  --dim:var(--mute); --dim2:var(--mute2); --amber:var(--bone); --amber-d:#9A9AA2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--void)}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased;
  line-height:1.5;min-height:100vh;letter-spacing:-.005em}
h1,h2,h3{margin:0}
.mono{font-family:'Azeret Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.disp{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.005em;font-weight:400}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.hide{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-family:'Anton',Impact,sans-serif;font-size:26px;line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.sub{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);margin-top:4px;text-transform:uppercase;letter-spacing:.14em}
.pill{margin-left:auto;font-family:'Azeret Mono';font-size:10px;padding:7px 10px;border-radius:0;
  background:var(--bone);color:var(--void);white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pill b{font-weight:700}

/* tabs */
.tabs{position:sticky;top:62px;z-index:30;background:var(--void);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:900px;margin:0 auto;padding:8px;display:flex;gap:6px}
.tab{appearance:none;background:none;border:1px solid transparent;color:var(--mute);cursor:pointer;
  font-family:'Archivo';font-weight:600;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:.15s;text-transform:uppercase;letter-spacing:.06em;border-radius:2px}
.tab:hover{color:var(--bone);border-color:var(--line)}
.tab.on{background:var(--bone);color:var(--void)}
.tab svg{width:14px;height:14px}

/* panel */
.panel{background:var(--slab);border:1px solid var(--line);border-radius:3px;padding:18px;margin-top:12px}
.panel-t{display:flex;align-items:center;gap:9px;font-family:'Anton',Impact,sans-serif;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px;line-height:1}
.panel-t svg{width:16px;height:16px;color:var(--signal)}
.muted{color:var(--mute);font-size:13.5px;margin:0}
.hint{color:var(--mute2);font-size:11.5px}
.divider{height:1px;background:var(--line2);margin:16px 0}

/* hero */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:3px;padding:22px;margin-top:12px;
  display:flex;gap:24px;align-items:center;flex-wrap:wrap;
  background-image:repeating-linear-gradient(45deg,rgba(242,240,235,.014) 0 2px,transparent 2px 9px)}
.gauge-box{flex:none;text-align:center}
.gauge-note{font-family:'Anton',Impact,sans-serif;font-size:56px;line-height:.85;letter-spacing:0}
.gauge-cap{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);letter-spacing:.14em;margin-top:6px;text-transform:uppercase}
.hero-body{flex:1;min-width:220px}
.hero-body h1{font-family:'Anton',Impact,sans-serif;font-size:32px;line-height:.95;text-transform:uppercase}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  padding:6px 10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;border-radius:2px}
.verdict svg{width:13px;height:13px}
.v-ok{background:var(--ok);color:var(--void)}
.v-mid{background:var(--bone);color:var(--void)}
.v-bad{background:var(--hot);color:#fff}
.v-none{background:rgba(242,240,235,.08);color:var(--mute)}

/* probe rows */
.probe{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.probe:last-child{border-bottom:none}
.probe-ic{width:30px;height:30px;border-radius:2px;background:var(--bone);color:var(--void);
  display:grid;place-items:center;flex:none}
.probe-ic svg{width:15px;height:15px}
.probe-name{font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em}
.probe-meta{font-family:'Azeret Mono';font-size:10.5px;color:var(--mute2);margin-top:2px}
.probe-val{margin-left:auto;display:flex;align-items:center;gap:10px}
.probe-num{font-family:'Azeret Mono';font-size:15px;font-weight:700}
.nbadge{display:inline-block;min-width:30px;text-align:center;font-family:'Anton',Impact,sans-serif;
  font-size:16px;padding:3px 7px;border-radius:2px;background:rgba(242,240,235,.07)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.tbl th,.tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line2)}
.tbl th{font-family:'Azeret Mono';color:var(--mute2);font-weight:500;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.1em}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td{font-family:'Azeret Mono';font-size:12px}
.tbl tr.hl td{background:rgba(242,240,235,.04)}
.tbl tr.top td{background:var(--signal);color:#fff}
.tbl tr.top .n{color:#fff}
.tbl .n{font-weight:700}
.scroll-x{overflow-x:auto}

/* accordion */
.acc{border:1px solid var(--line);border-radius:3px;margin-top:10px;overflow:hidden;background:var(--slab)}
.acc-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:14px;text-align:left}
.acc-num{font-family:'Anton',Impact,sans-serif;font-size:16px;color:var(--mute);width:28px;height:28px;
  border-radius:2px;background:rgba(242,240,235,.06);display:grid;place-items:center;flex:none;transition:.2s}
.acc.open .acc-num{background:var(--bone);color:var(--void)}
.acc-ttl{font-family:'Anton',Impact,sans-serif;font-size:18px;text-transform:uppercase;line-height:1}
.acc-wk{font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.acc-chev{margin-left:auto;color:var(--mute2);transition:transform .3s;width:18px;height:18px;flex:none}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .38s ease}
.acc.open .acc-body{max-height:2000px}
.acc-inner{padding:0 16px 16px 58px}
.wk{padding:11px 0;border-top:1px solid var(--line2)}
.wk-d{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.wk-p{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5}

/* inputs / buttons */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);text-transform:uppercase;letter-spacing:.1em}
.inp{background:var(--slab2);border:1px solid var(--line);border-radius:2px;color:var(--bone);
  font-family:'Azeret Mono';font-size:16px;padding:11px 12px;width:100%;outline:none}
.inp:focus{border-color:var(--signal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--bone);
  font-family:'Archivo';font-weight:700;font-size:11.5px;padding:11px 14px;border-radius:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  text-transform:uppercase;letter-spacing:.07em}
.btn:hover{border-color:var(--bone)}
.btn.solid{background:var(--bone);color:var(--void);border-color:transparent}
.btn.solid:hover{background:#fff}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--bone)}
.btn svg{width:14px;height:14px}
.btn.sm{padding:6px 9px;font-size:10px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:'Archivo';font-weight:600;font-size:11px;padding:7px 11px;border-radius:2px;cursor:pointer;
  transition:.15s;text-transform:uppercase;letter-spacing:.06em}
.chip:hover{color:var(--bone);border-color:var(--bone)}
.chip.on{background:var(--bone);color:var(--void);border-color:transparent}
.chip.sm{padding:5px 8px;font-family:'Azeret Mono';font-size:10px;letter-spacing:0}
.chip.dl{border-color:rgba(61,90,254,.5);color:var(--signal)}
.chip.dl.on{background:var(--signal);color:#fff;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* timer */
.ring-wrap{position:relative;width:230px;height:230px;margin:12px auto 2px}
.ring-wrap .inner{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.phase-tag{font-family:'Azeret Mono';font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.timer-num{font-family:'Anton',Impact,sans-serif;font-size:64px;line-height:.9;margin:6px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--slab2);border:1px solid var(--line);border-radius:2px;padding:13px}
.stat .k{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);text-transform:uppercase;letter-spacing:.12em}
.stat .v{font-family:'Anton',Impact,sans-serif;font-size:28px;margin-top:6px;line-height:.9}
.stat .v small{font-family:'Archivo';font-size:11px;color:var(--mute);font-weight:500}

/* method */
.method{border-left:3px solid var(--signal);padding:2px 0 2px 16px;margin-top:22px}
.method h3{font-family:'Anton',Impact,sans-serif;font-size:20px;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;line-height:1}
.method h3 svg{width:16px;height:16px;color:var(--signal)}
.method p{font-size:13.5px;color:var(--mute);margin:10px 0 0;line-height:1.6}
.method .src{font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-top:10px}
.klist{list-style:none;padding:0;margin:10px 0 0}
.klist li{font-size:13.5px;padding:5px 0 5px 18px;position:relative}
.klist li:before{content:'';position:absolute;left:0;top:12px;width:8px;height:2px;background:var(--signal)}

/* sets + callout */
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.setpill{background:var(--slab2);border:1px solid var(--line);border-radius:2px;padding:8px 12px;
  font-family:'Azeret Mono';font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
.setpill button{appearance:none;border:none;background:none;color:var(--mute2);cursor:pointer;
  display:grid;place-items:center;padding:0}
.setpill button:hover{color:var(--hot)}
.setpill svg{width:14px;height:14px}
.callout{background:var(--slab2);border:1px solid var(--line);border-left:3px solid var(--hot);
  border-radius:2px;padding:14px 16px;margin-top:14px;display:flex;gap:11px}
.callout svg{width:16px;height:16px;color:var(--hot);flex:none;margin-top:2px}
.callout .ct{font-size:13px;color:var(--mute);line-height:1.55}
.callout b{color:var(--bone);font-weight:700}
.callout.good{border-left-color:var(--ok)}
.callout.good svg{color:var(--ok)}

/* workout */
.wprog{margin-top:16px}
.wprog-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.wbar{height:3px;background:rgba(242,240,235,.08);overflow:hidden}
.wbar > i{display:block;height:100%;background:var(--signal);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.dgrid{display:grid;gap:8px;margin-top:12px}
.dcard{background:var(--slab);border:1px solid var(--line);border-radius:3px;overflow:hidden;transition:.2s}
.dcard.today{border-color:var(--bone);background:#181A1D}
.dcard.is-rest{opacity:.5}
.dcard-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:13px;text-align:left}
.dring{width:30px;height:30px;flex:none}
.dring-t{fill:var(--mute2);font-size:11px;font-family:'Azeret Mono';font-weight:700}
.dcard-b{flex:1;min-width:0;display:block}
.dcard-lbl{display:flex;align-items:center;gap:8px;font-family:'Azeret Mono';font-size:9.5px;
  color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.dcard-lbl em{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.1em;
  background:var(--signal);color:#fff;padding:3px 6px;border-radius:2px}
.dcard-day{display:block;font-family:'Anton',Impact,sans-serif;font-size:21px;text-transform:uppercase;line-height:.95}
.dcard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.dcard-date{font-family:'Azeret Mono';font-size:10px;color:var(--mute2)}
.dcard-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dcard.open .dcard-body{max-height:1600px}
.ex-list{padding:0 16px 8px;border-top:1px solid var(--line2);margin-top:2px}
.ex{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.ex:last-child{border-bottom:none}
.ex-tick{flex:1;min-width:0;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:0}
.ex-box{width:19px;height:19px;border-radius:2px;border:1.5px solid var(--line);background:var(--slab2);
  flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s;color:var(--void)}
.ex-box svg{width:12px;height:12px;stroke-width:3.5}
.ex.on .ex-box{background:var(--ok);border-color:transparent}
.ex-b{display:block;min-width:0}
.ex-n{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;transition:.15s}
.ex.on .ex-n{color:var(--mute2);text-decoration:line-through}
.ex-d{display:block;font-family:'Azeret Mono';font-size:11px;color:var(--mute);margin-top:4px;line-height:1.45}
.ex.on .ex-d{color:var(--mute2)}
.ex-rest{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:'Azeret Mono';font-size:10px;font-weight:700;padding:6px 8px;border-radius:2px;
  cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:5px;transition:.15s;margin-top:1px}
.ex-rest:hover{border-color:var(--signal);color:var(--signal)}
.ex-rest svg{width:11px;height:11px}
.ex-rest.live{background:var(--signal);color:#fff;border-color:transparent}
.sess-bar{display:flex;align-items:center;gap:10px;padding:12px 0 4px;flex-wrap:wrap}
.wtag{display:inline-block;font-family:'Azeret Mono';font-size:9.5px;font-weight:700;padding:4px 7px;
  border-radius:2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.wtag.hard{background:var(--hot);color:#fff}
.wtag.easy{background:rgba(74,222,128,.16);color:var(--ok)}
.wtag.power{background:var(--signal);color:#fff}
.wtag.cal{background:var(--bone);color:var(--void)}
.wtag.rest{background:rgba(242,240,235,.06);color:var(--mute2)}
.wfoot{font-size:12.5px;color:var(--mute);line-height:1.65}
.wfoot b{color:var(--bone);font-weight:700}

/* set log */
.ex{display:block;padding:12px 0;border-bottom:1px solid var(--line2)}
.ex-main{display:flex;align-items:flex-start;gap:10px}
.setlog{margin:12px 0 2px 31px;padding:12px;background:var(--slab2);border:1px solid var(--line);border-radius:2px}
.sugg{font-size:12px;color:var(--bone);display:flex;align-items:flex-start;gap:7px;line-height:1.45;
  padding:9px 10px;background:rgba(61,90,254,.12);border-left:2px solid var(--signal);margin-bottom:10px}
.sugg svg{width:13px;height:13px;color:var(--signal);flex:none;margin-top:2px}
.sugg b{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.sugg.up{background:rgba(74,222,128,.12);border-left-color:var(--ok)}
.sugg.up svg{color:var(--ok)}
.sugg.down{background:rgba(255,77,46,.1);border-left-color:var(--hot)}
.sugg.down svg{color:var(--hot)}
.prevline{font-size:10.5px;color:var(--mute2);margin-bottom:10px}
.setrow{display:grid;grid-template-columns:20px 1fr 1fr 56px 32px;gap:6px;align-items:center;margin-bottom:6px}
.setn{font-size:10px;color:var(--mute2);text-align:center}
.setcell{padding:8px;font-size:14px;text-align:center}
.sete{font-size:9.5px;color:var(--mute2);text-align:right}
.setadd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}

/* nutritie */
.mrow{margin-top:12px}
.mrow-h{display:flex;justify-content:space-between;font-family:'Azeret Mono';font-size:10.5px;
  color:var(--mute2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.mrow-h .over{color:var(--hot)}
.mbar{height:3px;background:rgba(242,240,235,.08);overflow:hidden}
.mbar > i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.rest-line{font-size:13px;color:var(--mute);margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.rest-line b{color:var(--bone)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.lrow:last-of-type{border-bottom:none}
.lrow-b{flex:1;min-width:0}
.lrow-n{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.lrow-m{font-family:'Azeret Mono';font-size:10.5px;color:var(--mute2);margin-top:3px}
.cust{display:grid;grid-template-columns:1fr 62px 48px 48px 48px auto;gap:6px}
.cust .inp{font-size:13px;padding:9px 8px}
.add-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  width:28px;height:28px;border-radius:2px;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.add-btn:hover{background:var(--bone);color:var(--void);border-color:transparent}
.add-btn svg{width:14px;height:14px}
.slot{background:var(--slab);border:1px solid var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.slot-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:12px;text-align:left}
.slot-n{font-family:'Anton',Impact,sans-serif;font-size:18px;text-transform:uppercase;flex:1;line-height:1}
.slot-t{font-family:'Azeret Mono';font-size:10.5px;color:var(--mute2)}
.slot-b{max-height:0;overflow:hidden;transition:max-height .4s ease}
.slot.open .slot-b{max-height:4000px;overflow-y:auto}
.slot-in{padding:0 16px 14px;border-top:1px solid var(--line2)}
.meal{padding:13px 0;border-bottom:1px solid var(--line2)}
.meal:last-child{border-bottom:none}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-n{font-size:13px;font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.02em}
.meal-k{font-family:'Azeret Mono';font-size:11.5px;font-weight:700}
.meal-m{font-family:'Azeret Mono';font-size:10.5px;color:var(--signal);margin-top:4px;letter-spacing:.04em}
.meal-i{font-family:'Azeret Mono';font-size:10.5px;color:var(--mute2);margin-top:5px;line-height:1.55}

/* jurnal */
.wo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wo-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--bone);
  font-family:'Archivo';font-size:11.5px;font-weight:700;padding:14px 12px;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left;transition:.15s;text-transform:uppercase;letter-spacing:.05em}
.wo-btn:hover{background:var(--bone);color:var(--void);border-color:transparent}
.wo-btn:hover svg{color:var(--void)}
.wo-btn:active{transform:scale(.98)}
.wo-btn svg{width:16px;height:16px;color:var(--signal);flex:none;transition:.15s}
.strip{display:flex;gap:6px;margin-top:16px}
.strip .day{flex:1;text-align:center}
.strip .dot{width:100%;aspect-ratio:1;max-width:38px;margin:0 auto 6px;border-radius:2px;
  background:var(--slab2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute2)}
.strip .dot.on{background:var(--ok);border-color:transparent;color:var(--void)}
.strip .dot svg{width:15px;height:15px}
.strip .dl{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);text-transform:uppercase;letter-spacing:.08em}
.entry{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:none}
.entry-ic{width:28px;height:28px;border-radius:2px;background:var(--slab2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--signal);flex:none}
.entry-ic svg{width:14px;height:14px}
.entry-b{flex:1;min-width:0}
.entry-t{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.entry-note{background:none;border:none;border-bottom:1px solid var(--line);color:var(--mute);
  font-family:'Azeret Mono';font-size:11px;padding:5px 0;width:100%;outline:none;margin-top:4px}
.entry-note:focus{border-bottom-color:var(--signal);color:var(--bone)}
.entry-note::placeholder{color:var(--mute2)}
.daygroup{margin-top:16px}
.daygroup-h{font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-bottom:4px;letter-spacing:.1em}

/* chart */
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart .grid{stroke:rgba(242,240,235,.06);stroke-width:1}
.chart .axis{fill:#5A5A61;font-size:9px;font-family:'Azeret Mono'}
.chart .tline{stroke:var(--signal);stroke-width:1.5;stroke-dasharray:4 4}
.chart .tlabel{fill:var(--signal);font-size:9px;font-family:'Azeret Mono'}
.chart .path{fill:none;stroke:var(--bone);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--signal)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bone);color:var(--void);
  animation:dockUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dockUp{from{transform:translateY(100%)}to{transform:none}}
.dock-in{max-width:900px;margin:0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px}
.dock-blk{display:flex;align-items:center;gap:10px;min-width:0}
.dock-blk svg{color:var(--void)}
.dock-ring{width:36px;height:36px;flex:none}
.dock-k{font-family:'Azeret Mono';font-size:8.5px;color:rgba(10,10,11,.55);letter-spacing:.14em}
.dock-v{font-family:'Anton',Impact,sans-serif;font-size:24px;line-height:1}
.dock-v.rest{color:var(--signal)}
.dock-sep{width:1px;align-self:stretch;background:rgba(10,10,11,.15)}
.dock-acts{margin-left:auto;display:flex;gap:8px;flex:none}
.dock .btn{border-color:rgba(10,10,11,.25);color:var(--void)}
.dock .btn.solid{background:var(--void);color:var(--bone)}
body.has-dock .wrap{padding-bottom:150px}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--void);display:grid;place-items:center;
  padding:24px;cursor:pointer;overflow:hidden}
.intro.out{animation:introOut .45s cubic-bezier(.4,0,.2,1) forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.intro-c{text-align:center;position:relative;z-index:2}
.intro-mark{width:120px;height:120px;margin:0 auto;display:block;
  clip-path:inset(0 100% 0 0);animation:wipeIn .55s cubic-bezier(.65,0,.35,1) .15s forwards}
@keyframes wipeIn{to{clip-path:inset(0 0 0 0)}}
.intro-word{font-family:'Anton',Impact,sans-serif;font-size:76px;line-height:.85;text-transform:uppercase;
  margin-top:20px;letter-spacing:.02em;clip-path:inset(0 0 100% 0);
  animation:riseIn .5s cubic-bezier(.3,.9,.3,1) .62s forwards}
@keyframes riseIn{to{clip-path:inset(0 0 0 0)}}
.intro-sub{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute);margin-top:12px;
  letter-spacing:.34em;text-transform:uppercase;opacity:0;animation:fadeIn .4s ease 1.05s forwards}
@keyframes fadeIn{to{opacity:1}}
.intro-rule{height:3px;background:var(--signal);width:0;margin:18px auto 0;
  animation:ruleIn .45s cubic-bezier(.65,0,.35,1) .92s forwards}
@keyframes ruleIn{to{width:150px}}
.intro-skip{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:'Azeret Mono';
  font-size:9.5px;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;opacity:0;
  animation:fadeIn .4s ease 1.6s forwards}
.intro-bars{position:absolute;inset:0;z-index:1;display:flex}
.intro-bars i{flex:1;background:var(--slab);transform:translateY(-101%);animation:barDrop .5s cubic-bezier(.65,0,.35,1) forwards}
.intro-bars i:nth-child(1){animation-delay:.02s}.intro-bars i:nth-child(2){animation-delay:.07s}
.intro-bars i:nth-child(3){animation-delay:.12s}.intro-bars i:nth-child(4){animation-delay:.17s}
.intro-bars i:nth-child(5){animation-delay:.22s}
@keyframes barDrop{to{transform:translateY(0)}}

.count{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulsing{animation:pulse 1s ease-in-out infinite}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .intro-mark,.intro-word,.intro-sub,.intro-rule,.intro-skip,.intro-bars i{animation:none;opacity:1;
    clip-path:none;transform:none}
  .intro-rule{width:150px}
  .fade,.count,.pulsing,.dock{animation:none}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .gauge-note{font-size:46px}
  .ttl{font-size:22px}
  .hero-body h1{font-size:26px}
  .intro-word{font-size:52px}
  .wo-grid{grid-template-columns:1fr}
  .cust{grid-template-columns:1fr 1fr 1fr}
  .cust .inp:first-child{grid-column:1/-1}
}
</style>
</head>

/* ---------- stocare (window.storage → localStorage → memorie) ---------- */
const store={
  _mem:{},
  async get(k){
    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){}
    return this._mem[k]!==undefined?this._mem[k]:null;
  },
  async set(k,v){
    this._mem[k]=v;
    try{ if(window.storage&&window.storage.set){await window.storage.set(k,JSON.stringify(v),false);return;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

/* ---------- jurnal de mese ---------- */
function mlogDay(dk){ return ((S.mlog||{})[dk])||[]; }
function dayTot(dk){
  return mlogDay(dk).reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,g:a.g+m.g}),{k:0,p:0,c:0,g:0});
}
// zilele complet logate hrănesc estimarea TDEE (zilele parțiale ar denatura media)
function kcalDays(){
  const out={}, ml=S.mlog||{};
  Object.keys(ml).forEach(dk=>{ const t=dayTot(dk); if(ml[dk].length>=3 && t.k>=1500) out[dk]=Math.round(t.k); });
  return out;
}
function barRow(lbl,val,tgt,unit,col){
  const pct=tgt?Math.min(100,Math.round(val/tgt*100)):0;
  const over=tgt&&val>tgt*1.05;
  return `<div class="mrow">
    <div class="mrow-h"><span>${lbl}</span>
      <span class="mono ${over?'over':''}">${Math.round(val)}${unit} / ${tgt}${unit}</span></div>
    <div class="mbar"><i style="width:${pct}%;background:${over?'var(--bad)':col}"></i></div></div>`;
}

/* ---------- nutriție: motor adaptiv ---------- */
const KCAL_PER_KG=7700;               // ~7700 kcal / kg țesut
const SLOTS=[['mic dejun',0,.25],['gustare 1',3,.10],['prânz',1,.275],['gustare 2',3,.10],['cină',2,.275]];

function nSet(){ return Object.assign({sex:'m',age:30,h:200,startW:125,goalW:100,rate:0.8,act:1.55,manual:null},S.nutri||{}); }
function weights(){ const w=S.weights||{}; return Object.keys(w).sort().map(k=>({d:k,w:w[k]})); }
function avgRange(arr,from,to){ const s=arr.slice(from,to); return s.length? s.reduce((a,b)=>a+b.w,0)/s.length : null; }

// media mobilă pe 7 zile — filtrează zgomotul din apă
function trend(){
  const a=weights(); if(a.length<4) return null;
  const last=avgRange(a,Math.max(0,a.length-7),a.length);
  const prev=avgRange(a,Math.max(0,a.length-14),Math.max(0,a.length-7));
  const days=Math.min(7,a.length-1);
  return {last, prev, perWeek: (prev!=null&&days>0)? (last-prev) : null, n:a.length};
}

// TDEE din date reale (aport + variație de greutate) — bate orice formulă
function tdeeAdaptive(){
  const t=trend(), n=nSet();
  const kc=kcalDays(), keys=Object.keys(kc).sort().slice(-14);
  const mifflin=10*(t&&t.last?t.last:n.startW)+6.25*n.h-5*n.age+5;
  const est=Math.round(mifflin*n.act);
  if(!t||t.perWeek==null||keys.length<7) return {kcal:est, src:keys.length?`formulă (mai ai ${7-keys.length} zile logate complet)`:'formulă (Mifflin × activitate)'};
  const avgIn=keys.reduce((a,k)=>a+kc[k],0)/keys.length;
  const adaptive=Math.round(avgIn - (t.perWeek*KCAL_PER_KG/7));
  if(adaptive<1600||adaptive>6000) return {kcal:est, src:'formulă (date insuficiente)'};
  return {kcal:adaptive, src:'date reale (aport + trend greutate)'};
}

// macro: proteina pe greutatea-țintă, grăsimea cu prag minim, restul carbohidrați
function targets(){
  const n=nSet(), t=trend();
  const cur=t&&t.last?t.last:n.startW;
  const td=tdeeAdaptive();
  const bmr=10*cur+6.25*n.h-5*n.age+5;
  // plafon de siguranță: deficitul nu trece de 25% din necesar și nu coborâm sub BMR×1.1
  const wanted=n.rate*KCAL_PER_KG/7;
  const maxDef=Math.min(wanted, td.kcal*0.25);
  const floor=Math.max(Math.round(bmr*1.1), 1900);
  let kcal = n.manual || Math.max(floor, Math.round((td.kcal-maxDef)/10)*10);
  const capped = !n.manual && maxDef < wanted-20;
  const p=Math.round(n.goalW*2.0);            // 2.0 g/kg greutate-țintă
  const fMin=Math.round(cur*0.6);             // prag hormonal
  let f=Math.round(cur*0.7), c=Math.round((kcal-p*4-f*9)/4);
  if(c<80){ f=Math.max(fMin,Math.round((kcal-p*4-80*4)/9)); c=Math.round((kcal-p*4-f*9)/4); }
  return {kcal,p,c,f,fMin,cur,tdee:td,capped,realRate:((td.kcal-kcal)*7/KCAL_PER_KG)};
}

// verdict adaptiv: stagnare ≥10 zile → tai din carbohidrați, proteina rămâne
function verdict(){
  const a=weights(), t=trend(), n=nSet();
  if(a.length<10) return {s:'wait', msg:`Mai ai nevoie de ${10-a.length} cântăriri ca să pot decide. Cântărește-te dimineața, după toaletă, înainte de mâncare.`};
  const span=(new Date(a[a.length-1].d)-new Date(a[Math.max(0,a.length-10)].d))/864e5;
  const rate=t.perWeek;
  if(rate==null) return {s:'wait', msg:'Încă strâng date pentru trend.'};
  if(rate<=-n.rate*1.5) return {s:'fast', cut:0, msg:`Scazi ${Math.abs(rate).toFixed(2)} kg/săpt — prea repede. Riști să pierzi mușchi. Adaugă ~150 kcal din carbohidrați.`};
  if(rate<=-n.rate*0.6) return {s:'ok', cut:0, msg:`Scazi ${Math.abs(rate).toFixed(2)} kg/săpt — exact în țintă. Nu schimba nimic.`};
  if(rate<0) return {s:'slow', cut:0, msg:`Scazi doar ${Math.abs(rate).toFixed(2)} kg/săpt. Mai așteaptă câteva zile înainte să tai — poate fi apă.`};
  return {s:'stall', cut:180, msg:`Greutatea stă de ~${Math.round(span)} zile. Taie 180 kcal — toate din carbohidrați (~45 g). Proteina și grăsimea rămân neatinse.`};
}

function gaugeSVG(avg){
  const R=52,C=Math.PI*R;
  const frac=avg==null?0:Math.max(0,Math.min(1,avg/10));
  const col=avg==null?'var(--mute2)':avg>=9.995?'var(--ok)':avg>=9?'var(--steel)':'var(--bad)';
  const ang=-90+frac*180;
  let ticks='';
  for(let i=0;i<=10;i++){

    ticks+=`<line x1="${(65+r1*Math.sin(a)).toFixed(2)}" y1="${(68-r1*Math.cos(a)).toFixed(2)}"
      x2="${(65+r2*Math.sin(a)).toFixed(2)}" y2="${(68-r2*Math.cos(a)).toFixed(2)}"
      stroke="${i===10?'var(--signal)':'rgba(185,201,217,.28)'}" stroke-width="${major?1.6:1}"/>`;
  }
  return `<div class="gauge-box">
    <svg width="150" height="88" viewBox="0 0 130 76" aria-hidden="true">
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="rgba(185,201,217,.1)" stroke-width="2"/>
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="${col}" stroke-width="2"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
      ${ticks}
      <g transform="rotate(${ang} 65 68)"><line x1="65" y1="68" x2="65" y2="26"
        stroke="${col}" stroke-width="2.4" stroke-linecap="round"/></g>

    </svg>

    <div class="gauge-cap">medie · maxim 10.00</div>
  </div>`;
}

function badge(n){

function lineChart(pts,{target,reversed,fmt,labels}){
  if(!pts.length) return '';
  const W=680,H=220,ml=52,mr=14,mt=14,mb=28;
  const vals=pts.concat([target]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo){hi+=1;lo-=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>ml+(pts.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(pts.length-1));
  const y=v=>{const f=(v-lo)/(hi-lo);return reversed?mt+f*(H-mt-mb):H-mb-f*(H-mt-mb);};
  let grid='',axis='';
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, yy=y(v);
    grid+=`<line class="grid" x1="${ml}" y1="${yy.toFixed(1)}" x2="${W-mr}" y2="${yy.toFixed(1)}"/>`;
    axis+=`<text class="axis" x="${ml-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const dots=pts.map((v,i)=>`<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3"/>`).join('');
  const xl=labels.map((l,i)=>`<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const ty=y(target);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
    ${grid}${axis}
    <line class="tline" x1="${ml}" y1="${ty.toFixed(1)}" x2="${W-mr}" y2="${ty.toFixed(1)}"/>
    <text class="tlabel" x="${W-mr}" y="${(ty-6).toFixed(1)}" text-anchor="end">nota 10</text>
    <path class="path" d="${d}"/>${dots}${xl}
  </svg>`;
}

/* ---------- greutăți pe serie + progresie ---------- */
// schema țintă din descriere: "4×8–10", "5×3–6", "12 runde × 5 rep"
function parseScheme(detail){
  const t=(detail||'').replace(/\s/g,'');
  const m=t.match(/(\d+)(?:runde)?[×x](\d+)(?:[–-](\d+))?(?!s)/i);
  if(!m) return null;
  const sets=+m[1], lo=+m[2], hi=m[3]?+m[3]:+m[2];
  if(sets>20||lo>60) return null;
  return {sets,lo,hi};
}
function liftKey(name){ return name.replace(/^ABDOMEN — /,'').trim(); }
function liftHist(name){ return ((S.lifts||{})[liftKey(name)])||[]; }
function e1rm(w,r){ return w>0? Math.round(w*(1+r/30)) : 0; }
function stepFor(name){
  const n=name.toLowerCase();
  if(/leg press|hip thrust|sanie|ramat|helcometru/.test(n)) return 5;
  return 2.5;
}
// dublă progresie: umpli intervalul de repetări, apoi crești greutatea
function suggest(name, detail){
  const sc=parseScheme(detail); if(!sc) return null;
  const h=liftHist(name); const last=h[h.length-1];
  if(!last||!last.s.length) return {txt:`${sc.sets}×${sc.lo}${sc.hi>sc.lo?'–'+sc.hi:''} — prima sesiune, alege o greutate cu care termini toate seriile`,first:true};
  const ws=last.s.map(x=>x[0]), rs=last.s.map(x=>x[1]);
  const w=Math.max(...ws), minR=Math.min(...rs), done=last.s.length;
  const bw=w<=0;
  if(bw){
    const tot=rs.reduce((a,b)=>a+b,0);
    return {txt:`${sc.sets}×${minR+1} rep (data trecută: ${rs.join('/')} = ${tot} total)`, w:0, r:minR+1};
  }
  if(minR>=sc.hi && done>=sc.sets){
    const nw=w+stepFor(name);
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai umplut intervalul, crește greutatea`, w:nw, r:sc.lo, up:true};
  }
  if(minR<sc.lo){
    const nw=Math.max(stepFor(name), Math.round((w*0.92)/stepFor(name))*stepFor(name));
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai ratat intervalul, scade ~8%`, w:nw, r:sc.lo, down:true};
  }
  return {txt:`${sc.sets}×${minR+1} @ ${w} kg — aceeași greutate, adaugă o repetare`, w, r:minR+1};
}
function bestE1rm(name){
  let b=0,d='';
  liftHist(name).forEach(s=>s.s.forEach(([w,r])=>{const e=e1rm(w,r); if(e>b){b=e;d=s.d;}}));
  return b?{v:b,d}:null;
}
function setLogUI(name, detail, dk, id){
  const sc=parseScheme(detail), sg=suggest(name,detail), h=liftHist(name);
  const todaySess=(h[h.length-1]&&h[h.length-1].d===todayKey())?h[h.length-1]:null;
  const sets=todaySess?todaySess.s:[];
  const prev=h.filter(x=>x.d!==todayKey()).slice(-1)[0];
  const best=bestE1rm(name);
  const rows=sets.map((st,i)=>`<div class="setrow">
    <span class="setn mono">${i+1}</span>
    <input class="inp setcell" type="number" inputmode="decimal" step="0.5" value="${st[0]||''}" placeholder="kg"
      data-setedit="${esc(name)}" data-i="${i}" data-f="w">

      data-setedit="${esc(name)}" data-i="${i}" data-f="r">
    <span class="sete mono">${st[0]>0?e1rm(st[0],st[1])+' 1RM':''}</span>
    <button class="btn ghost sm" data-act="setdel" data-n="${esc(name)}" data-i="${i}">${ic('trash')}</button>
  </div>`).join('');
  return `<div class="setlog">
    ${sg?`<div class="sugg ${sg.up?'up':sg.down?'down':''}">${ic('trend')} <b>Următoarea:</b> ${esc(sg.txt)}</div>`:''}
    ${prev?`<div class="prevline mono">Sesiunea trecută (${shortDate(prev.d)}): ${prev.s.map(x=>(x[0]>0?x[0]+'kg×':'')+x[1]).join(' · ')}</div>`:''}
    ${rows}
    <div class="setadd">
      <button class="btn sm" data-act="setadd" data-n="${esc(name)}" data-w="${sg&&sg.w?sg.w:0}" data-r="${sg&&sg.r?sg.r:(sc?sc.lo:0)}">
        ${ic('plus')} Adaugă serie</button>
      ${best?`<span class="hint mono">record estimat 1RM: ${best.v} kg</span>`:''}
    </div>
  </div>`;
}

const TEST_DAY={t:'ZI DE TEST — cele 3 probe',k:'hard',min:75,ex:[
  ['Încălzire de concurs','15–20 min, exact ca în ziua probei'],
  ['50m cronometrat','2 încercări, cea mai bună contează · pauză 5 min'],
  ['1000m cronometrat','după pauză completă · pauză 8 min'],
  ['Tracțiuni maxim','priza de concurs, fără balans'],
  ['Notează rezultatele în Progres','fără asta, planul rămâne pe estimări']]};
// săptămânile 4 și 8 din fiecare bloc = descărcare; săptămâna 8 începe cu test
function isDeload(w){ return w===3||w===7; }
function dayFor(b,w,d){
  if(w===7&&d===0) return TEST_DAY;
  return BLOCKS[b].days[d];
}
function mondayOf(k){ const d=new Date(k+'T00:00'); const off=(d.getDay()+6)%7; return dayShift(k,-off); }
function exId(b,w,d,x){ return 'b'+b+'w'+w+'d'+d+'e'+x; }
function dayKey(b,w,d){ return 'b'+b+'w'+w+'d'+d; }
function dayNum(b,w,d){ return BLOCK_START[b]+w*BLOCKS[b].days.length+d; }
function dayDone(b,w,d,day){
  const log=(S.wlog||{})[dayKey(b,w,d)]||{};
  let n=0; day.ex.forEach((_,x)=>{ if(log[exId(b,w,d,x)]) n++; });
  return n;
}
function dayFull(b,w,d,day){ return day.ex.length>0 && dayDone(b,w,d,day)===day.ex.length; }
// ziua curentă = prima neterminată din bloc
function nextDay(b){
  const B=BLOCKS[b];
  for(let w=0;w<B.weeks;w++) for(let d=0;d<B.days.length;d++)
    if(!dayFull(b,w,d,dayFor(b,w,d))) return {w,d};
  return {w:B.weeks-1,d:B.days.length-1};
}

    <div class="panel"><div class="panel-t">${ic('trend')} Evoluție</div>
      <div class="chips" style="margin-top:8px">
        ${[['run','1000m'],['sprint','50m'],['pull','Tracțiuni']].map(m=>
          `<button class="chip ${S.metric===m[0]?'on':''}" data-act="metric" data-k="${m[0]}">${m[1]}</button>`).join('')}
      </div>${chart}
      ${rows.length?`<div class="hint">${conf.hint}</div>`:''}
    </div>${hist}</div>`;
}

function viewJurnal(){
  const w=S.workouts||{}, entries=w.entries||[], tk=todayKey();
  const dset=new Set(entries.map(e=>e.date));
  let streak=0, d=tk; while(dset.has(d)){streak++;d=dayShift(d,-1);}
  const weekStart=dayShift(tk,-6);
  const weekCount=entries.filter(e=>e.date>=weekStart).length;
  const strip=Array.from({length:7},(_,i)=>{const k=dayShift(tk,-(6-i));
    return {on:dset.has(k),dl:new Date(k+'T00:00').toLocaleDateString('ro-RO',{weekday:'short'}).replace('.','')};});
  const today=entries.filter(e=>e.date===tk);
  const byDate={}; entries.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const dates=Object.keys(byDate).filter(x=>x!==tk).sort().reverse();
  const row=(e,editable)=>{const s=SESSMAP[e.sid]||['','Sesiune','activity'];
    return `<div class="entry"><div class="entry-ic">${ic(s[2])}</div>
      <div class="entry-b"><div class="entry-t">${esc(s[1])}</div>
      ${editable?`<input class="entry-note" value="${esc(e.note)}" placeholder="notează detalii (opțional)" data-note="${e.eid}">`
        :(e.note?`<div class="hint mono" style="margin-top:2px">${esc(e.note)}</div>`:'')}</div>
      <button class="btn ghost sm" data-act="delWo" data-k="${e.eid}">${ic('trash')}</button></div>`;};
  return `<div class="fade">
    <div class="panel"><div class="panel-t">${ic('calCheck')} Jurnal antrenamente</div>
      <p class="muted">Bifează sesiunea când o termini și notează ce ai făcut efectiv (ex. „6×400 @ 1:23").</p>
      <div class="wo-grid">${SESSIONS.map(s=>`<button class="wo-btn" data-act="logWo" data-k="${s[0]}">${ic(s[2])} ${s[1]}</button>`).join('')}</div>
    </div>
    <div class="panel">
      <div class="stats" style="margin-top:0">
        <div class="stat"><div class="k">Serie</div><div class="v">${streak} <small>${streak===1?'zi':'zile'}</small></div></div>
        <div class="stat"><div class="k">Săptămâna asta</div><div class="v">${weekCount}</div></div>
        <div class="stat"><div class="k">Total</div><div class="v">${entries.length}</div></div>
      </div>
      <div class="strip">${strip.map(s=>`<div class="day"><div class="dot ${s.on?'on':''}">${s.on?ic('check'):''}</div>
        <div class="dl">${s.dl}</div></div>`).join('')}</div>
    </div>
    ${today.length?`<div class="panel"><div class="panel-t">${ic('flame')} Azi · ${today.length}</div>
      ${today.map(e=>row(e,true)).join('')}</div>`:''}
    ${dates.length?`<div class="panel"><div class="panel-t">${ic('list')} Istoric</div>
      ${dates.map(dk=>`<div class="daygroup"><div class="daygroup-h">${shortDate(dk)}</div>
        ${byDate[dk].map(e=>row(e,false)).join('')}</div>`).join('')}</div>`:''}
    ${entries.length?'':`<div class="panel"><p class="muted">Niciun antrenament încă. Apasă o sesiune de mai sus ca s-o adaugi în ziua de azi.</p></div>`}
  </div>`;
}

const VIEWS={brief:viewBrief,program:viewProgram,workout:viewWorkout,tools:viewTools,
  methods:viewMethods,progress:viewProgress,jurnal:viewJurnal,nutri:viewNutri};

/* ---------- pauze & cronometru de sesiune ---------- */
function parseRest(detail,name){
  const t=(detail||'').toLowerCase();
  let m=t.match(/pauz[ăa]\s*(?:activ[ăa]\s*)?(\d+)\s*min/);      if(m) return +m[1]*60;
  m=t.match(/pauz[ăa]\s*(?:de\s*)?(\d+)\s*[–-]?\s*(\d+)?\s*s/); if(m) return +m[1];
  m=t.match(/pauz[ăa]\s*(\d+):(\d+)/);                            if(m) return +m[1]*60+ +m[2];
  if(/pauz[ăa]\s*complet|recuperare complet/.test(t)) return 240;
  const n=(name||'').toLowerCase();
  if(/încălzire|incalzire|cool[ -]?down|mobilitate|mobility|stretching|foam|somn|mers|drill|notează|respirație|reset|alergare|zona 2|alergat|bicicletă/.test(n)) return 0;
  if(/tracțiuni cu greutate|negative|hip thrust|ramat|sanie/.test(n)) return 180;
  if(/accelerații|starturi|flying|50m|sprint/.test(n)) return 240;
  if(/maxim|la eșec|test/.test(n)) return 180;
  if(/gtg|submaximal/.test(n)) return 0;
  if(/flotări|dips|core|plank|hollow|picioare|abdomene|priză|prosop|atârnat|farmer|pogo|bounding|pliometrie|strides|dealuri/.test(n)) return 90;
  return 120;
}
function startRest(sec,label){
  if(!sec) return;
  unlockAudio();
  S.rest={left:sec,total:sec,label:label||''};
  ensureDock(); paintDock();
}
function unlockAudio(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
function sessElapsed(){ return S.sess? Math.max(0,Math.floor((Date.now()-S.sess.start)/1000)) : 0; }
function ensureDock(){
  document.body.classList.toggle('has-dock',!!(S.sess||S.rest));
  let d=document.getElementById('dock');
  if(!(S.sess||S.rest)){ if(d) d.remove(); stopDock(); return; }
  if(!d){ d=document.createElement('div'); d.className='dock'; d.id='dock'; document.body.appendChild(d); }
  if(!dockHandle) dockHandle=setInterval(dockTick,1000);
}
function stopDock(){ if(dockHandle){clearInterval(dockHandle);dockHandle=null;} }
function dockTick(){
  const si=document.getElementById('sessInline'); if(si&&S.sess) si.textContent=fmtTime(sessElapsed());
  if(S.rest){
    S.rest.left--;
    if(S.rest.left<=3&&S.rest.left>0) beep(880,.06);
    if(S.rest.left<=0){ beep(1320,.14); setTimeout(()=>beep(1320,.14),190); S.rest=null; ensureDock(); }
  }
  paintDock();
}
function paintDock(){
  const d=document.getElementById('dock'); if(!d) return;
  const R=16,C=2*Math.PI*R;
  let html='<div class="dock-in">';
  if(S.sess){
    html+=`<div class="dock-blk">${ic('timer')}<div>
      <div class="dock-k">ANTRENAMENT</div>
      <div class="dock-v mono">${fmtTime(sessElapsed())}</div></div></div>`;
  }
  if(S.rest){
    if(S.sess) html+='<div class="dock-sep"></div>';
    const frac=S.rest.left/S.rest.total;
    html+=`<div class="dock-blk">
      <svg class="dock-ring" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="rgba(185,201,217,.14)" stroke-width="3"/>
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--signal)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
          transform="rotate(-90 19 19)" style="transition:stroke-dashoffset .9s linear"/>
      </svg>
      <div><div class="dock-k">PAUZĂ</div>
      <div class="dock-v rest mono">${fmtTime(S.rest.left)}</div></div></div>`;
  }
  html+='<div class="dock-acts">';
  if(S.rest) html+=`<button class="btn ghost sm" data-act="restStop">Sari</button>`;
  if(S.sess) html+=`<button class="btn solid sm" data-act="sessStop">Termină</button>`;
  html+='</div></div>';
  d.innerHTML=html;
}

/* ---------- randare ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<button class="tab ${S.tab===t[0]?'on':''}" data-act="tab" data-k="${t[0]}">${ic(t[2])} ${t[1]}</button>`).join('');
}
function renderPill(){

}

}

/* ---------- cronometru ---------- */
function beep(freq=1100,dur=.09){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur+.02);
  }catch(e){}
}
function timerPaint(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  const el=document.getElementById('tLeft'); if(!el) return;
  const totalP=T.phase==='work'?cfg.work:T.phase==='rest'?cfg.rest:T.phase==='prep'?cfg.prep:1;
  const frac=(T.phase==='idle'||T.phase==='done')?0:T.left/totalP;
  const C=2*Math.PI*100;
  const col=T.phase==='work'?'var(--signal)':T.phase==='rest'?'var(--ok)':T.phase==='done'?'var(--ok)':'var(--mute2)';
  el.textContent=fmtTime(T.left);
  const ring=document.getElementById('tRing');
  if(ring){ring.setAttribute('stroke-dashoffset',C*(1-frac));ring.setAttribute('stroke',col);}
  const ph=document.getElementById('tPhase');
  if(ph){ph.textContent={work:'EFORT',rest:'PAUZĂ',prep:'PREGĂTIRE',done:'GATA',idle:'STANDBY'}[T.phase];
    ph.style.color=col; ph.classList.toggle('pulsing',T.running&&T.phase==='work');}
  const rd=document.getElementById('tRound');
  if(rd) rd.textContent=(T.phase==='idle'||T.phase==='done')?cfg.rounds+' reprize':'repriza '+T.round+' / '+cfg.rounds;
}
function timerTick(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  if(T.left>1){ T.left--; if(T.left<=3) beep(880,.06); timerPaint(); return; }
  if(T.phase==='prep'){ T.phase='work'; T.left=cfg.work; T.round=1; beep(1320,.12); }
  else if(T.phase==='work'){
    if(T.round>=cfg.rounds){ T.phase='done'; T.left=0; T.running=false; stopTimer();
      beep(660,.12); setTimeout(()=>beep(520,.12),150); setTimeout(()=>beep(392,.25),300); render(); return; }
    T.phase='rest'; T.left=cfg.rest; beep(980,.08);
  } else if(T.phase==='rest'){ T.phase='work'; T.left=cfg.work; T.round++; beep(1320,.12); }
  timerPaint();
}
function startTimer(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  if(T.phase==='idle'||T.phase==='done'){ T.phase='prep'; T.left=cfg.prep; T.round=0; }
  T.running=true; stopTimer(); tickHandle=setInterval(timerTick,1000); render();
}
function stopTimer(){ if(tickHandle){clearInterval(tickHandle);tickHandle=null;} }

/* ---------- acțiuni ---------- */
async function save(key,val,prop){ S[prop]=val; await store.set(key,val); }

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, i=el.dataset.i, k=el.dataset.k, tk=todayKey();

  if(a==='tab'){ S.tab=k; render(); window.scrollTo({top:0}); return; }
  if(a==='phase'){ S.openPhase=S.openPhase===+i?-1:+i; render(); return; }
  if(a==='wblock'){ S.weekBlock=+i; S.wWeek=null; S.openDay=-1; render(); return; }
  if(a==='wweek'){ S.wWeek=+i; S.openDay=-1; render(); return; }
  if(a==='metric'){ S.metric=k; render(); return; }
  if(a==='pnote'){ S.paceNote=+i; render(); return; }
  if(a==='pweeks'){ S.paceWeeks=+i; render(); return; }

  if(a==='tpreset'){ S.timer={cfg:+i,phase:'idle',left:0,round:0,running:false}; stopTimer(); render(); return; }
  if(a==='tstart'){ startTimer(); return; }
  if(a==='tpause'){ S.timer.running=false; stopTimer(); render(); return; }
  if(a==='treset'){ S.timer={cfg:S.timer.cfg,phase:'idle',left:0,round:0,running:false}; stopTimer(); render(); return; }

  if(a==='gtgmax'){ const m=+document.getElementById('gtgMax').value;
    if(m>0) await save('zece:gtg',Object.assign({},S.gtg||{},{max:m,days:(S.gtg&&S.gtg.days)||{}}),'gtg');
    render(); return; }
  if(a==='gtgadd'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    const t=Math.max(1,Math.round((g.max||0)*0.5));
    days[tk]=(days[tk]||[]).concat([t]);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }
  if(a==='gtgdel'){ const g=S.gtg||{}, days=Object.assign({},g.days||{});
    days[tk]=(days[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:gtg',Object.assign({},g,{days}),'gtg'); render(); return; }

  if(a==='openday'){ S.openDay=S.openDay===+i?-1:+i; render(); return; }
  if(a==='ex'){ const x=el.dataset.x, log=Object.assign({},S.wlog||{});
    const day=Object.assign({},log[k]||{});
    if(day[x]) delete day[x]; else day[x]=1;
    log[k]=day; await save('zece:wlog',log,'wlog'); render(); return; }
  if(a==='exlog'){ S.exOpen=S.exOpen===el.dataset.x?null:el.dataset.x; render(); return; }
  if(a==='setadd'){ const nm=liftKey(el.dataset.n), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(); let cur=h[h.length-1];
    if(!cur||cur.d!==tk){ cur={d:tk,s:[]}; h.push(cur); } else { cur=Object.assign({},cur,{s:cur.s.slice()}); h[h.length-1]=cur; }
    cur.s=cur.s.concat([[+el.dataset.w||0,+el.dataset.r||0]]);
    L[nm]=h.slice(-12); await save('zece:lifts',L,'lifts'); render(); return; }
  if(a==='setdel'){ const nm=liftKey(el.dataset.n), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(); const cur=h[h.length-1];
    if(cur&&cur.d===tk){ const ns=cur.s.filter((_,j)=>j!==+i);
      if(ns.length) h[h.length-1]=Object.assign({},cur,{s:ns}); else h.pop(); }
    if(h.length) L[nm]=h; else delete L[nm];
    await save('zece:lifts',L,'lifts'); render(); return; }
  if(a==='rest'){ startRest(+el.dataset.r,el.dataset.x); render(); return; }
  if(a==='restStop'){ S.rest=null; ensureDock(); paintDock(); render(); return; }
  if(a==='sessStart'){ unlockAudio(); S.sess={date:k,start:Date.now()};
    await store.set('zece:sess',S.sess); ensureDock(); paintDock(); render(); return; }
  if(a==='sessStop'){
    if(S.sess){ const mins=Math.max(1,Math.round(sessElapsed()/60));
      const log=Object.assign({},S.wlog||{});
      log[S.sess.date]=Object.assign({},log[S.sess.date]||{},{__min:mins});
      S.sess=null; await store.set('zece:sess',null); await save('zece:wlog',log,'wlog'); }
    ensureDock(); render(); return; }
  if(a==='logMeal'){ const m=MEALS[+k]; const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:m[1],k:m[2],p:m[3],c:m[4],g:m[5]}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='unlogMeal'){ const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='logCustom'){ const g=id=>document.getElementById(id);
    const nm=(g('cN').value||'').trim(), kk=+g('cK').value||0;
    if(!nm||!kk) return;
    const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:nm,k:kk,p:+g('cP').value||0,c:+g('cC').value||0,g:+g('cG').value||0}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='mslot'){ S.mOpen=S.mOpen===+i?-1:+i; render(); return; }
  if(a==='mfilter'){ S.mFilter=!S.mFilter; render(); return; }
  if(a==='wAdd'){ const val=parseFloat(document.getElementById('wIn').value);
    if(val>30&&val<300){ const w=Object.assign({},S.weights||{}); w[tk]=Math.round(val*10)/10;
      await save('zece:weights',w,'weights'); } render(); return; }
  if(a==='applyCut'){ const T=targets(), n=nSet();
    await save('zece:nutri',Object.assign({},n,{manual:T.kcal-(+i)}),'nutri'); render(); return; }
  if(a==='clearManual'){ await save('zece:nutri',Object.assign({},nSet(),{manual:null}),'nutri'); render(); return; }
  if(a==='wreset'){ const B=BLOCKS[S.weekBlock], wk=(S.wWeek==null)?nextDay(S.weekBlock).w:S.wWeek;
    const log=Object.assign({},S.wlog||{});
    B.days.forEach((_,d)=>{ const k2=dayKey(S.weekBlock,wk,d), keep=(log[k2]||{}).__min;
      if(keep) log[k2]={__min:keep}; else delete log[k2]; });
    await save('zece:wlog',log,'wlog'); render(); return; }

  if(a==='addTest'){
    const m=+document.getElementById('tM').value||0, s=+document.getElementById('tS').value||0;
    const sp=document.getElementById('tSp').value, pu=document.getElementById('tPu').value;
    const run=m*60+s;
    if(!run&&!sp&&!pu) return;
    const next=S.tests.concat([{date:tk,run:run||null,sprint:sp?+sp:null,pull:pu?+pu:null}]);
    await save('zece:tests',next,'tests'); render(); return; }
  if(a==='delTest'){ await save('zece:tests',S.tests.filter((_,j)=>j!==+i),'tests'); render(); return; }

  if(a==='logWo'){ const w=S.workouts||{}, entries=(w.entries||[]).concat([
      {eid:Date.now()+'-'+Math.random().toString(36).slice(2,6),sid:k,date:tk,note:''}]);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts'); render(); return; }
  if(a==='delWo'){ const w=S.workouts||{};
    await save('zece:workouts',Object.assign({},w,{entries:(w.entries||[]).filter(e=>e.eid!==k)}),'workouts');
    render(); return; }
});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='paceM'){ S.paceM=t.value; refreshPace(); }
  if(t.id==='paceS'){ S.paceS=t.value; refreshPace(); }
});
let paceTimer=null;
function refreshPace(){ clearTimeout(paceTimer); paceTimer=setTimeout(()=>{ if(S.tab==='tools') render(); },600); }

document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.setedit){
    const nm=liftKey(t.dataset.setedit), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(), cur=h[h.length-1];
    if(cur&&cur.d===todayKey()){
      const ns=cur.s.map(x=>x.slice()); const idx=+t.dataset.i;
      if(ns[idx]){ ns[idx][t.dataset.f==='w'?0:1] = +t.value||0; }
      h[h.length-1]=Object.assign({},cur,{s:ns}); L[nm]=h;
      await save('zece:lifts',L,'lifts'); render();
    }
    return;
  }
  if(t.dataset && t.dataset.note){
    const w=S.workouts||{};
    const entries=(w.entries||[]).map(e=>e.eid===t.dataset.note?Object.assign({},e,{note:t.value}):e);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts');
  }
});

/* ---------- intro ---------- */
(function intro(){
  const el=document.getElementById('intro');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const close=()=>{ if(!el.parentNode) return; el.classList.add('out'); setTimeout(()=>el.remove(),470); };
  setTimeout(close,reduced?700:2350);
  el.addEventListener('click',close);
})();

/* ---------- pornire ---------- */
(async function init(){
  render();
  const [t,g,l,w,wt,nu,kl,lf]=await Promise.all([store.get('zece:tests'),store.get('zece:gtg'),
    store.get('zece:wlog'),store.get('zece:workouts'),store.get('zece:weights'),
    store.get('zece:nutri'),store.get('zece:mlog'),store.get('zece:lifts')]);
  if(wt) S.weights=wt; if(nu) S.nutri=nu; if(kl) S.mlog=kl; if(lf) S.lifts=lf;
  if(Array.isArray(t)) S.tests=t;
  if(g) S.gtg=g; if(l) S.wlog=l; if(w) S.workouts=w;
  const sv=await store.get('zece:sess'); if(sv&&sv.start) S.sess=sv;
  S.openDay=nextDay(0).d;
  ensureDock(); paintDock();
  const last=latestFull();
  if(last&&last.run){ S.paceM=Math.floor(last.run/60); S.paceS=last.run%60; }
  render();
})();
